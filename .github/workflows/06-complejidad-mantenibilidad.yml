name: 06. Complejidad y Mantenibilidad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintainability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore API_SDD.slnx
      - run: dotnet build API_SDD.slnx -c Release --no-restore
      - run: dotnet test UnitTest/UnitTest.csproj -c Release --no-build --filter "FullyQualifiedName~Maintainability|FullyQualifiedName~VerticalSliceConventionTests"
      - run: pwsh -File scripts/critic-guardrails.ps1
