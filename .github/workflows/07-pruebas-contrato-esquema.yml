name: 07. Pruebas de Contrato y Esquema

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore API_SDD.slnx
      - run: dotnet build API_SDD.slnx -c Release --no-restore
      - run: dotnet test ContractTest/ContractTest.csproj -c Release --no-build --filter "FullyQualifiedName~PingFixtureTests"
      - run: dotnet test UnitTest/UnitTest.csproj -c Release --no-build --filter "FullyQualifiedName~ContractLoginRequestDtoPreservesExpectedJsonPropertyNames"
