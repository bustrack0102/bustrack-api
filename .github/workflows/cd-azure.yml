name: CD Azure Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Omitir pruebas previas (despliegue de emergencia)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Verify Quality Gate
    runs-on: ubuntu-latest
    if: "${{ !inputs.skip_tests }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore API_SDD.slnx

      - name: Build solution
        run: dotnet build API_SDD.slnx -c Release --no-restore

      - name: Run Unit & Non-Docker Integration/Security Tests
        run: |
          dotnet test UnitTest/UnitTest.csproj -c Release --no-build
          dotnet test IntegrationTest/IntegrationTest.csproj -c Release --no-build --filter "FullyQualifiedName~HealthTests|FullyQualifiedName~ErrorsTests|FullyQualifiedName~RoutingTests|FullyQualifiedName~EpRoutingTests|FullyQualifiedName~CoreEndpointsIntegrationTests"
          dotnet test SecurityTest/SecurityTest.csproj -c Release --no-build --filter "FullyQualifiedName~HeadersTests|FullyQualifiedName~AssemblyIntegrityTests|FullyQualifiedName~NoSqlSecurityTests"

      - name: SDD & Critic Guardrails
        run: |
          pwsh -File scripts/check_sdd.ps1
          pwsh -File scripts/critic-guardrails.ps1

      - name: Static Security Analysis (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/rules/semgrep.yaml

  deploy-azure:
    name: Deploy to Azure Container Apps / ACI
    needs: [verify]
    if: always() && (needs.verify.result == 'success' || inputs.skip_tests == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Azure Container Registry credentials
        run: |
          ACR_NAME=bustrackacr0102
          az acr update --name "$ACR_NAME" --admin-enabled true -o none
          echo "ACR_LOGIN_SERVER=$(az acr show -n $ACR_NAME --query loginServer -o tsv)" >> $GITHUB_ENV
          echo "ACR_USERNAME=$(az acr credential show -n $ACR_NAME --query username -o tsv)" >> $GITHUB_ENV
          echo "ACR_PASSWORD=$(az acr credential show -n $ACR_NAME --query passwords[0].value -o tsv)" >> $GITHUB_ENV

      - name: Build and push image to ACR (SemVer 0.4.0)
        run: |
          echo "::add-mask::$ACR_PASSWORD"
          echo "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" --username "$ACR_USERNAME" --password-stdin
          SHORT_SHA="${GITHUB_SHA::12}"
          TAG="${ACR_LOGIN_SERVER%/}/bustrack-api:0.4.0-${SHORT_SHA}"
          TAG_LATEST="${ACR_LOGIN_SERVER%/}/bustrack-api:latest"
          docker build -t "$TAG" -t "$TAG_LATEST" -f Dockerfile .
          docker push "$TAG"
          docker push "$TAG_LATEST"
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      - name: Deploy bustrack-api (Container App if present, otherwise ACI)
        run: |
          if az containerapp show -g rg-bustrack-ncus -n bustrack-api -o none 2>/dev/null; then
            echo "Actualizando Azure Container App bustrack-api..."
            az containerapp secret set -g rg-bustrack-ncus -n bustrack-api \
              --secrets \
                mongodb-cs="${{ secrets.MONGODB_CONNECTION_STRING }}" \
                jwt-key="${{ secrets.JWT_SECRET_KEY }}" \
                internal-key="${{ secrets.INTERNAL_SERVICE_KEY }}" -o none
            az containerapp update -g rg-bustrack-ncus -n bustrack-api \
              --image "$IMAGE_TAG" \
              --set-env-vars \
                PORT=8000 \
                ASPNETCORE_ENVIRONMENT=Production \
                DataProtection__KeysPath=/app/keys \
                Persistence__Provider=MongoDB \
                MongoDb__Database=BusTrackNoSQL \
                MongoDb__ConnectionString=secretref:mongodb-cs \
                Jwt__Key=secretref:jwt-key \
                InternalService__Key=secretref:internal-key \
                EnableHttpsRedirection=false -o none
            FQDN=$(az containerapp show -g rg-bustrack-ncus -n bustrack-api --query "properties.configuration.ingress.fqdn" -o tsv)
            echo "API_URL=https://${FQDN}" >> $GITHUB_ENV
          else
            echo "Desplegando bustrack-api en ACI (etapa de transición)..."
            az container create \
              --resource-group rg-bustrack-ncus \
              --name bustrack-api \
              --image "$IMAGE_TAG" \
              --registry-login-server "$ACR_LOGIN_SERVER" \
              --registry-username "$ACR_USERNAME" \
              --registry-password "$ACR_PASSWORD" \
              --dns-name-label bustrack-api-uttt \
              --ports 8000 \
              --os-type Linux \
              --cpu 1 \
              --memory 1.5 \
              --environment-variables \
                PORT=8000 \
                ASPNETCORE_ENVIRONMENT=Production \
                DataProtection__KeysPath=/app/keys \
                Persistence__Provider=MongoDB \
                MongoDb__Database=BusTrackNoSQL \
                EnableHttpsRedirection=false \
              --secure-environment-variables \
                MongoDb__ConnectionString="${{ secrets.MONGODB_CONNECTION_STRING }}" \
                Jwt__Key="${{ secrets.JWT_SECRET_KEY }}" \
                InternalService__Key="${{ secrets.INTERNAL_SERVICE_KEY }}" -o none
            echo "API_URL=http://bustrack-api-uttt.northcentralus.azurecontainer.io:8000" >> $GITHUB_ENV
          fi

      - name: Smoke Test & Readiness Gate (/health + /health/ready + /api/v1/ping)
        run: |
          echo "Verificando $API_URL..."
          HEALTHY=0
          for i in $(seq 1 30); do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$API_URL/health" || echo "000")
            if [ "$STATUS_CODE" -eq 200 ]; then
              HEALTHY=1
              break
            fi
            sleep 10
          done
          [ "$HEALTHY" -eq 1 ] || { az container logs -g rg-bustrack-ncus -n bustrack-api || true; exit 1; }
          READY_CODE=$(curl -s -o /tmp/ready.json -w "%{http_code}" --max-time 15 "$API_URL/health/ready" || echo "000")
          cat /tmp/ready.json
          [ "$READY_CODE" -eq 200 ] || { az container logs -g rg-bustrack-ncus -n bustrack-api --tail 40 || true; echo "Error: /health/ready retornó HTTP $READY_CODE"; exit 1; }
          grep -q '"status":"Healthy"' /tmp/ready.json || { az container logs -g rg-bustrack-ncus -n bustrack-api --tail 40 || true; echo "Error: /health/ready no está Healthy"; exit 1; }
          curl -sf --max-time 10 "$API_URL/api/v1/ping"
