name: CD Azure Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Omitir pruebas previas (despliegue de emergencia)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Verify Quality Gate
    runs-on: ubuntu-latest
    if: "${{ !inputs.skip_tests }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore API_SDD.slnx

      - name: Build solution
        run: dotnet build API_SDD.slnx -c Release --no-restore

      - name: Run Unit Tests
        run: dotnet test UnitTest/UnitTest.csproj -c Release --no-build

      - name: Static Security Analysis (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/rules/semgrep.yaml

  deploy-azure:
    name: Deploy to Azure Container Instances
    needs: [verify]
    if: always() && (needs.verify.result == 'success' || inputs.skip_tests == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Ensure Azure Container Registry exists
        run: |
          ACR_NAME=bustrackacr0102
          if ! az acr show --name "$ACR_NAME" -o none 2>/dev/null; then
            echo "Creando ACR $ACR_NAME..."
            az acr create --name "$ACR_NAME" \
              --resource-group rg-bustrack-ncus \
              --sku Basic --admin-enabled true
          else
            echo "ACR $ACR_NAME ya existe."
            az acr update --name "$ACR_NAME" --admin-enabled true
          fi
          # Credenciales admin (efímeras en este job, nunca se escriben al repo)
          echo "ACR_LOGIN_SERVER=$(az acr show -n $ACR_NAME --query loginServer -o tsv)" >> $GITHUB_ENV
          echo "ACR_USERNAME=$(az acr credential show -n $ACR_NAME --query username -o tsv)" >> $GITHUB_ENV
          echo "ACR_PASSWORD=$(az acr credential show -n $ACR_NAME --query passwords[0].value -o tsv)" >> $GITHUB_ENV

      - name: Build and push image to ACR
        run: |
          TAG="${ACR_LOGIN_SERVER%/}/bustrack-api:${GITHUB_SHA::12}"
          az acr build --registry bustrackacr0102 \
            --image bustrack-api:${GITHUB_SHA::12} \
            --image bustrack-api:latest \
            --file Dockerfile .
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV

      - name: Export current container group configuration
        run: |
          az container export \
            --resource-group rg-bustrack-ncus \
            --name bustrack-api \
            --file group-original.yml
          cat group-original.yml

      - name: Prepare deployment YAML (new image + ACR credentials)
        run: |
          python3 - <<'EOF'
          import os, yaml
          with open('group-original.yml') as f:
              doc = yaml.safe_load(f)
          cg = doc['apiVersion'] and doc
          container = cg['containers'][0]
          container['image'] = os.environ['IMAGE_TAG']
          container['ports'] = [{'port': 8000, 'protocol': 'TCP'}]
          cg['imageRegistryCredentials'] = [{
              'server': os.environ['ACR_LOGIN_SERVER'],
              'username': os.environ['ACR_USERNAME'],
              'password': os.environ['ACR_PASSWORD'],
          }]
          with open('group-deploy.yml', 'w') as f:
              yaml.safe_dump(doc, f, sort_keys=False, default_flow_style=False)
          print(open('group-deploy.yml').read())
          EOF

      - name: Replace Azure Container Instance with new image
        run: |
          az container delete \
            --resource-group rg-bustrack-ncus \
            --name bustrack-api --yes
          az container create \
            --resource-group rg-bustrack-ncus \
            --file group-deploy.yml

      - name: Smoke Test & Health Check Probe
        run: |
          API_URL="http://bustrack-api-uttt.northcentralus.azurecontainer.io:8000"
          echo "Verificando disponibilidad de la API en $API_URL..."
          MAX_RETRIES=30
          DELAY=10
          HEALTHY=0

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Intento $i/$MAX_RETRIES: Consultando $API_URL/health..."
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$API_URL/health" || echo "000")
            if [ "$STATUS_CODE" -eq 200 ]; then
              echo "✅ El servicio respondió con 200 OK!"
              HEALTHY=1
              break
            fi
            echo "El contenedor aún está iniciando (código HTTP $STATUS_CODE). Esperando ${DELAY}s..."
            sleep $DELAY
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "❌ Error: La API no respondió 200 OK tras $((MAX_RETRIES * DELAY)) segundos."
            exit 1
          fi

          echo "Probando endpoint de ping..."
          PING_BODY=$(curl -s --max-time 10 "$API_URL/api/v1/ping" || echo "")
          echo "Respuesta de Ping: $PING_BODY"

      - name: Generate Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Resumen de Despliegue en Azure" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Propiedad | Detalle |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Estado** | 🟢 Exitoso |" >> $GITHUB_STEP_SUMMARY
          echo "| **Resource Group** | \`rg-bustrack-ncus\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Contenedor** | \`bustrack-api\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Región** | North Central US |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL Pública** | [bustrack-api-uttt](http://bustrack-api-uttt.northcentralus.azurecontainer.io:8000) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Liveness Probe** | [\`/health\`](http://bustrack-api-uttt.northcentralus.azurecontainer.io:8000/health) (200 OK) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ping Probe** | [\`/api/v1/ping\`](http://bustrack-api-uttt.northcentralus.azurecontainer.io:8000/api/v1/ping) (200 OK) |" >> $GITHUB_STEP_SUMMARY
