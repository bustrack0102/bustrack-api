name: CI PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Build, Test & Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore API_SDD.slnx

      - name: Build solution
        run: dotnet build API_SDD.slnx -c Release --no-restore

      - name: Run Unit Tests with Coverage
        run: dotnet test UnitTest/UnitTest.csproj -c Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Run Integration & Security Tests (no-Docker baseline)
        run: |
          dotnet test IntegrationTest/IntegrationTest.csproj -c Release --no-build --filter "FullyQualifiedName~HealthTests|FullyQualifiedName~ErrorsTests|FullyQualifiedName~RoutingTests|FullyQualifiedName~EpRoutingTests"
          dotnet test SecurityTest/SecurityTest.csproj -c Release --no-build --filter "FullyQualifiedName~HeadersTests|FullyQualifiedName~AssemblyIntegrityTests"

      - name: Validación SDD & Critic Guardrails
        run: |
          pwsh -File scripts/check_sdd.ps1
          pwsh -File scripts/critic-guardrails.ps1

      - name: Static Security Analysis (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/rules/semgrep.yaml

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: code-coverage-report
          path: ./TestResults/**/coverage.cobertura.xml
          retention-days: 14
