name: Terraform Infra Lifecycle

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Operación IaC sobre rg-bustrack-ncus'
        required: true
        type: choice
        default: 'plan'
        options:
          - plan
          - apply
          - destroy
      retire_legacy_aci:
        description: 'Eliminar instancias ACI legacy tras validar Container Apps HTTPS en apply'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform (${{ inputs.action }})
    runs-on: ubuntu-latest
    env:
      ARM_USE_MSI: false
      TF_IN_AUTOMATION: true
      TF_VAR_mongodb_connection_string: ${{ secrets.MONGODB_CONNECTION_STRING }}
      TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
      TF_VAR_internal_service_key: ${{ secrets.INTERNAL_SERVICE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Export ARM credentials from AZURE_CREDENTIALS
        shell: bash
        run: |
          python3 - <<'EOF' >> "$GITHUB_ENV"
          import json, os
          creds = json.loads("""${{ secrets.AZURE_CREDENTIALS }}""")
          print(f"ARM_CLIENT_ID={creds['clientId']}")
          print(f"ARM_CLIENT_SECRET={creds['clientSecret']}")
          print(f"ARM_SUBSCRIPTION_ID={creds['subscriptionId']}")
          print(f"ARM_TENANT_ID={creds['tenantId']}")
          EOF

      - name: Ensure Terraform Remote State Storage Account
        shell: bash
        run: |
          RG="rg-bustrack-ncus"
          SA="bustracktfstate0102"
          if ! az storage account show -g "$RG" -n "$SA" -o none 2>/dev/null; then
            az storage account create -g "$RG" -n "$SA" -l northcentralus --sku Standard_LRS --min-tls-version TLS1_2 --https-only true -o none
          fi
          KEY=$(az storage account keys list -g "$RG" -n "$SA" --query "[0].value" -o tsv)
          echo "::add-mask::$KEY"
          echo "TF_STATE_KEY=$KEY" >> "$GITHUB_ENV"
          az storage container create --name tfstate --account-name "$SA" --account-key "$KEY" -o none

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform Init
        working-directory: infra/terraform
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=rg-bustrack-ncus" \
            -backend-config="storage_account_name=bustracktfstate0102" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=bustrack.tfstate" \
            -backend-config="access_key=$TF_STATE_KEY"

      - name: Terraform Format Check & Validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive || echo "::warning::Run terraform fmt -recursive to normalize whitespace"
          terraform validate

      - name: Terraform Plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        working-directory: infra/terraform
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply & Smoke Verification
        if: inputs.action == 'apply'
        working-directory: infra/terraform
        run: |
          terraform apply -input=false -auto-approve tfplan
          API_URL=$(terraform output -raw api_https_url)
          LANDING_URL=$(terraform output -raw landing_https_url)
          echo "Verificando API HTTPS en $API_URL y Landing en $LANDING_URL..."
          for i in $(seq 1 24); do
            CODE=$(curl -s -o /tmp/ready.json -w "%{http_code}" --max-time 15 "$API_URL/health/ready" || echo "000")
            if [ "$CODE" -eq 200 ]; then
              cat /tmp/ready.json
              grep -q '"status":"Healthy"' /tmp/ready.json
              break
            fi
            sleep 10
          done
          [ "$CODE" -eq 200 ] || exit 1
          curl -sf --max-time 15 "$LANDING_URL/health"
          az containerapp replica list -g rg-bustrack-ncus -n bustrack-api -o table

      - name: Retire Expensive Legacy ACI Containers
        if: inputs.action == 'apply' && inputs.retire_legacy_aci == true
        run: |
          for NAME in bustrack-api bustrack-genai bustrack-landing; do
            az container delete -g rg-bustrack-ncus -n "$NAME" --yes -o none || true
          done

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        working-directory: infra/terraform
        run: terraform destroy -input=false -auto-approve
