name: Sec 13. Criptografia y Datos Sensibles

on:
  push:
    branches: [feat/security-and-engineering-repertoire, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore API_SDD.slnx
      - run: dotnet build API_SDD.slnx -c Release --no-restore
      - run: dotnet test UnitTest/UnitTest.csproj -c Release --no-build --filter "FullyQualifiedName~PasswordHasherTests|FullyQualifiedName~JwtTokenServiceTests|FullyQualifiedName~FintechSecurityTests"
