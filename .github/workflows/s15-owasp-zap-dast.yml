name: Sec 15. DAST en Vivo (OWASP ZAP)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bustrack-api:zap -f Dockerfile .
      - run: |
          docker run -d --name zap-api -p 8000:8000 \
            -e PORT=8000 \
            -e Persistence__Provider=InMemory \
            -e Jwt__Key=synthetic-ci-zap-test-key-minimum-32-chars \
            -e InternalService__Key=synthetic-internal-zap-key \
            bustrack-api:zap
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://127.0.0.1:8000/health'
          fail_action: false
