name: Sec 15. DAST en Vivo (OWASP ZAP)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bustrack-api:zap -f Dockerfile .
            - run: |
          docker run -d --name zap-api -p 8000:8000 \
            -e ASPNETCORE_URLS=http://+:8000 \
            -e Persistence__Provider=InMemory \
            -e Jwt__Key=synthetic-ci-zap-test-key-minimum-32-chars \
            -e InternalService__Key=synthetic-internal-zap-key \
            bustrack-api:zap

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              ready=1
              break
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' zap-api)" != "true" ]; then
              break
            fi

            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "La API no respondió en http://127.0.0.1:8000/health"
            docker logs zap-api
            exit 1
          fi
