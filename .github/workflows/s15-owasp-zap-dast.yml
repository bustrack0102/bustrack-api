name: Sec 15. DAST en Vivo (OWASP ZAP)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bustrack-api:zap -f Dockerfile .
      - run: |
          docker run -d --name zap-api --network host \
            -e PORT=8000 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e Persistence__Provider=MongoDB \
            -e ConnectionStrings__Default="Server=127.0.0.1;Database=API_SDD;User Id=sa;Password=MockPassword#123;TrustServerCertificate=True" \
            -e MongoDb__ConnectionString="mongodb://127.0.0.1:27017/BusTrackDB" \
            -e MongoDb__Database=BusTrackDB \
            -e Jwt__Key=synthetic-ci-zap-test-key-minimum-32-chars \
            -e InternalService__Key=synthetic-internal-zap-key \
            -e DataProtection__KeysPath=/app/keys \
            bustrack-api:zap
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then
              echo "API lista y respondiendo en el puerto 8000"
              break
            fi
            echo "Esperando arranque de API ($i/30)..."
            sleep 2
          done
          echo "=== Logs del contenedor zap-api ==="
          docker logs zap-api --tail 50
      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://127.0.0.1:8000/health'
          fail_action: false
