name: Security Repertoire (13 Gates)

on:
  push:
    branches: [feat/security-and-engineering-repertoire, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast-and-supply-chain:
    name: 1-9. SAST, Supply Chain y Secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 25
      - uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/rules/semgrep.yaml
      - name: Secret & Supply Chain Audit
        run: |
          pwsh -Command '
            $pat = "(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|ghp_[A-Za-z0-9]{30,}|xoxb-[0-9A-Za-z-]+)"
            $hits = Get-ChildItem -Recurse -File | Where-Object { $_.FullName -notmatch "/(\.git|bin|obj)/" } | Select-String -Pattern $pat
            if ($hits) { throw "Secrets detected in workspace" }
            if (git log -n 20 -p | Select-String -Pattern $pat) { throw "Secrets detected in git history" }
            Write-Host "Secret scan passed."
          '

  sca-licenses-and-malware:
    name: 2-10-11. SCA, Licencias y Typosquatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore API_SDD.slnx
      - run: dotnet list API_SDD.slnx package --vulnerable --include-transitive
      - run: dotnet list API_SDD.slnx package --include-transitive

  container-and-iac-security:
    name: 5-6. Seguridad de Contenedores e IaC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Audit Dockerfile & Terraform
        run: |
          ! grep -iE '(password|secret|token)=' Dockerfile
          if [ -d infra/terraform ]; then
            ! grep -rnE '(password|secret_key|connection_string)\s*=\s*"[^$]' infra/terraform/
          fi

  dast-auth-fuzz-crypto:
    name: 4-7-8-12-13. DAST, Auth, Fuzzing, RateLimit y Crypto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore API_SDD.slnx
      - run: dotnet build API_SDD.slnx -c Release --no-restore
      - run: dotnet test UnitTest/UnitTest.csproj -c Release --no-build
      - run: dotnet test IntegrationTest/IntegrationTest.csproj -c Release --no-build --filter "FullyQualifiedName~HealthTests|FullyQualifiedName~ErrorsTests|FullyQualifiedName~RoutingTests"
      - run: dotnet test SecurityTest/SecurityTest.csproj -c Release --no-build --filter "FullyQualifiedName~HeadersTests|FullyQualifiedName~AssemblyIntegrityTests|FullyQualifiedName~NoSqlSecurityTests|FullyQualifiedName~OperationalSecurityTests|FullyQualifiedName~IntelligenceSecurityTests"
